name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Unzip project files
        run: |
          mkdir source_code
          unzip WgClient.zip -d source_code
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build debug APK
        working-directory: ./source_code
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: source_code/app/build/outputs/apk/debug/app-debug.apk
